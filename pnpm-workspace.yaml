packages:
  - 'extensions/*'
engineStrict: true
autoInstallPeers: true
shamefullyHoist: true
enablePrePostScripts: true
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  core-js: false
  esbuild: true
  msw: false
  prisma: true
  protobufjs: false
  unrs-resolver: true
